<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Gallery</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1{
            margin-bottom: 30px;
        }
        .animes{
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .anime{
            text-align: center;
        }

        .anime img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid #333;
        }

        .anime p{
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>My Anime Gallery</h1>

    <div class="animes">

        <div class="anime">
            <img src="Demon.jpg" alt="Golden Retriever">
            <p>“No matter how many people you lose, you have no choice but to go on living.”</p>
        </div>

        <div class="anime">
            <img src="Zenitsu.jpg" alt="Dog Image-1">
            <p>“I’m not strong. I’m just trying my best.”</p>
        </div>

        <div class="anime">
            <img src="Gojo.jpg" alt="Dog Image-3">
            <p>“When you’re given everything, you can’t do anything.”</p>
        </div>

    </div>

</body>
</html>
